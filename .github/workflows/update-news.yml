name: 更新加密新闻数据

on:
  schedule:
    # 每 30 分钟（:03 / :33 UTC）；避免 */15 在 Actions 排队时堆积过多 pending
    - cron: '3,33 * * * *'
  workflow_dispatch:
    inputs:
      force_seed:
        description: '强制重新播种（回填近12小时）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 获取现有数据
        id: get-data
        run: |
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            git fetch origin gh-pages
            if git show origin/gh-pages:state.json >/dev/null 2>&1; then
              git show origin/gh-pages:state.json > state.json
              echo "has_state=true" >> $GITHUB_OUTPUT
              echo "✓ 已获取现有状态数据"
            else
              echo "has_state=false" >> $GITHUB_OUTPUT
              echo "ℹ gh-pages 分支存在但无状态数据，将首次播种"
            fi
          else
            echo "has_state=false" >> $GITHUB_OUTPUT
            echo "ℹ gh-pages 分支不存在，将首次播种"
          fi

      - name: 抓取和处理新闻
        id: fetch
        run: |
          python3 fetch_news.py \
            ${{ (steps.get-data.outputs.has_state == 'false' || inputs.force_seed) && '--seed' || '' }}
      
      - name: 处理日历事件
        id: calendar
        run: |
          pip install yfinance
          python3 fetch_calendar.py

      - name: 准备部署
        run: |
          mkdir -p deploy
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            git fetch origin gh-pages
            git archive origin/gh-pages | tar -x -C deploy
            echo "✓ 已合并 gh-pages 现有内容（避免 force_orphan 丢失 movers/事件缓存等）"
          fi
          cp data.json deploy/
          cp state.json deploy/
          cp calendar.json deploy/
          cp index.html deploy/
          cp calendar.html deploy/
          cp events.html deploy/
          cp unlocks.html deploy/
          cp potential.html deploy/ 2>/dev/null || true
          cp potential.json deploy/ 2>/dev/null || true
          echo "" > deploy/.nojekyll

      - name: 输出摘要
        run: |
          echo "### 📰 新闻更新完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat summary.md >> $GITHUB_STEP_SUMMARY || echo "无摘要数据" >> $GITHUB_STEP_SUMMARY

      - name: 上传发布目录
        uses: actions/upload-artifact@v4
        with:
          name: gh-pages-payload
          path: deploy/
          retention-days: 1

  deploy:
    needs: update
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - name: 下载发布目录
        uses: actions/download-artifact@v4
        with:
          name: gh-pages-payload
          path: deploy

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: '更新新闻数据'
