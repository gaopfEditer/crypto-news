<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>解锁快照 - 加密新闻看板</title>
<style>
:root{--bg:#0b0e11;--panel:#12161c;--panel2:#181d25;--line:#232a35;--txt:#d6dde6;--dim:#7d8896;--mute:#59626e;
--up:#0ecb81;--down:#f6465d;--warn:#f0b90b;--acc:#3d8bfd}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Menlo,monospace}
a{color:#8fb8ff;text-decoration:none}a:hover{text-decoration:underline}
.top{position:sticky;top:0;z-index:5;background:#0d1117ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 14px}
.brand{font-weight:700;letter-spacing:.5px;color:var(--warn);font-family:Menlo,monospace}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:4px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--dim);font-size:12px;transition:all .2s}
.nav a:hover{border-color:var(--acc);color:var(--acc);text-decoration:none}
.nav a.active{background:var(--acc);border-color:var(--acc);color:#fff}
.sp{flex:1}
button,select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font:inherit;font-size:12px;cursor:pointer}
button:hover{border-color:#3a4554}
.stats{color:var(--dim);font-size:12px;padding:6px 14px;border-bottom:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap}
.stats b{color:var(--txt);font-weight:600}
.wrap{padding:12px 14px 60px;max-width:1400px}
.section-title{font-size:16px;font-weight:600;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.obs{padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:#9aa5b3;margin-bottom:12px;line-height:1.6}
.obs b{color:var(--txt)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--dim);font-weight:600;background:var(--panel2);position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(61,139,253,.04)}
.num{font-family:Menlo,monospace;text-align:right}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--acc)}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--dim)}
.badge{display:inline-block;font-size:10px;padding:1px 5px;border-radius:3px;border:1px solid var(--line);color:var(--dim);margin:1px 2px 1px 0;cursor:help}
.badge.warn{color:var(--warn);border-color:#5a4a12;background:#2a230b}
.badge.bad{color:var(--down);border-color:#5a2730;background:#2a1218}
.badge.info{color:var(--acc);border-color:#1f3350;background:#121f33}
.legend{font-size:11px;color:var(--mute);margin:6px 0 12px;line-height:1.5}
.empty{color:var(--dim);padding:40px;text-align:center}
.poll{color:var(--dim);font-size:12px;font-family:Menlo,monospace}
@media (max-width:700px){th,td{padding:5px 6px;font-size:11px}}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <span class="brand">◆ CRYPTO NEWS WATCH</span>
    <div class="nav">
      <a href="index.html">新闻</a>
      <a href="calendar.html">日历</a>
      <a href="unlocks.html" class="active">解锁快照</a>
    </div>
    <span class="sp"></span>
    <label class="poll">快照日期
      <select id="snapDate"><option value="">加载中…</option></select>
    </label>
    <span class="poll" id="poll">—</span>
  </div>
  <div class="stats" id="stats"></div>
</div>
<div class="wrap">
  <div class="obs" id="obs" style="display:none"></div>
  <div class="legend">
    标记说明：
    <span class="badge info" title="仅有一个数据源">single_source</span>
    <span class="badge warn" title="不同来源的解锁时间相差超过 6 小时">date_conflict</span>
    <span class="badge warn" title="不同来源的数量相差超过 25%">amount_conflict</span>
    <span class="badge" title="解锁后观察窗口不足 24 小时">short_post_window</span>
    <span class="badge bad" title="未能获取价格序列">no_price_data</span>
  </div>
  <h2 class="section-title">解锁与价格表现</h2>
  <div class="table-wrap">
    <table id="tblEvents">
      <thead><tr>
        <th>代币</th><th>解锁时间</th><th>数量</th><th>价值</th><th>占流通</th>
        <th>前7天</th><th>解锁后</th><th>同期BTC</th>
        <th class="sortable num" data-sort="relative_vs_btc_post_pp">相对BTC ▼</th>
        <th>来源</th><th>标记</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <h2 class="section-title">解锁前 7 天逐日涨跌（D-7 … D-1）</h2>
  <div class="table-wrap">
    <table id="tblDaily">
      <thead><tr>
        <th>代币</th><th>解锁时间</th>
        <th class="num">D-7</th><th class="num">D-6</th><th class="num">D-5</th><th class="num">D-4</th>
        <th class="num">D-3</th><th class="num">D-2</th><th class="num">D-1</th><th class="num">合计</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="empty" id="empty" style="display:none">暂无快照数据</div>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const RAW = "https://raw.githubusercontent.com/gaopfEditer/crypto-news/gh-pages";

async function tryJson(url){
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    return await r.json();
  } catch (e) {
    return null;
  }
}

async function loadJson(path){
  const bust = Math.floor(Date.now() / 30000);
  const localUrl = "./" + path + "?_=" + bust;
  const remoteUrl = RAW + "/" + path + "?_=" + bust;
  const [local, remote] = await Promise.all([tryJson(localUrl), tryJson(remoteUrl)]);
  if (!local && !remote) return null;
  if (remote && (!local || (remote.updated || 0) >= (local.updated || 0))) return { data: remote, src: "gh-pages" };
  return { data: local, src: "local" };
}

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtPct(v, d){
  if (v == null || Number.isNaN(v)) return '<span class="flat">N/A</span>';
  const cls = v > 0.05 ? "up" : v < -0.05 ? "down" : "flat";
  return `<span class="${cls}">${v >= 0 ? "+" : ""}${v.toFixed(d == null ? 1 : d)}%</span>`;
}
function fmtPp(v){
  if (v == null) return '<span class="flat">N/A</span>';
  const cls = v > 0.05 ? "up" : v < -0.05 ? "down" : "flat";
  return `<span class="${cls}">${v >= 0 ? "+" : ""}${v.toFixed(1)}pp</span>`;
}
function fmtUsd(v){
  if (v == null) return "N/A";
  if (v >= 1e9) return "$" + (v/1e9).toFixed(2) + "B";
  if (v >= 1e6) return "$" + (v/1e6).toFixed(2) + "M";
  if (v >= 1e3) return "$" + (v/1e3).toFixed(2) + "K";
  return "$" + v.toFixed(2);
}
function fmtAmt(v){
  if (v == null) return "N/A";
  const a = Math.abs(v);
  if (a >= 1e9) return (v/1e9).toFixed(2) + "B";
  if (a >= 1e6) return (v/1e6).toFixed(2) + "M";
  if (a >= 1e3) return (v/1e3).toFixed(2) + "K";
  return v.toFixed(2);
}
function shortTime(s){ return s ? s.slice(5, 16) : "—"; }

function parseFlags(flags){
  if (!flags) return [];
  return String(flags).split(";").map(s => s.trim()).filter(Boolean);
}
function flagBadges(flags){
  return parseFlags(flags).map(f => {
    let cls = "badge";
    let tip = f;
    if (f.startsWith("single_source")) { cls += " info"; tip = "仅一个数据源"; }
    else if (f.startsWith("date_conflict")) { cls += " warn"; tip = "来源间解锁时间不一致"; }
    else if (f.startsWith("amount_conflict")) { cls += " warn"; tip = "来源间数量差异较大"; }
    else if (f.startsWith("short_post_window")) { cls += ""; tip = "解锁后不足 24h，涨跌仅供参考"; }
    else if (f === "no_price_data") { cls += " bad"; tip = "无价格数据"; }
    const label = f.split("(")[0];
    return `<span class="${cls}" title="${esc(tip)}">${esc(label)}</span>`;
  }).join("");
}
function srcLabel(s){
  if (!s) return "—";
  return esc(s.split("|").map(x => x.trim().split(":")[0]).filter(Boolean).sort().join("+"));
}

let indexData = null;
let snap = null;
let sortRel = -1;

function renderObs(){
  const el = $("obs");
  const lines = (snap && snap.observations && snap.observations.summary_lines) || [];
  if (!lines.length){ el.style.display = "none"; return; }
  el.style.display = "block";
  el.innerHTML = "<b>观察</b>：" + lines.map(esc).join("；");
}

function renderStats(){
  if (!snap) return;
  $("stats").innerHTML = [
    `<span>窗口 <b>${esc(snap.window_utc8 && snap.window_utc8[0])} ~ ${esc(snap.window_utc8 && snap.window_utc8[1])}</b> (UTC+8)</span>`,
    `<span>生成 <b>${esc(snap.generated_utc8)}</b></span>`,
    `<span>事件 <b>${(snap.events || []).length}</b></span>`,
    `<span>阈值 <b>≥${fmtUsd(snap.thresholds && snap.thresholds.min_usd)} 或 ≥${snap.thresholds && snap.thresholds.min_pct}%</b></span>`
  ].join("");
}

function renderEvents(){
  const tb = $("tblEvents").querySelector("tbody");
  let rows = (snap.events || []).slice();
  if (sortRel){
    rows.sort((a,b) => {
      const av = a.relative_vs_btc_post_pp, bv = b.relative_vs_btc_post_pp;
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      return sortRel * (av - bv);
    });
  }
  tb.innerHTML = rows.map(r => {
    const val = r.value_usd_source != null ? r.value_usd_source : r.value_usd_at_unlock;
    return `<tr>
      <td><b>${esc(r.ticker)}</b> <span class="flat">${esc(r.name)}</span></td>
      <td>${esc(shortTime(r.unlock_time_utc8))}</td>
      <td class="num">${fmtAmt(r.amount)}</td>
      <td class="num">${fmtUsd(val)}</td>
      <td class="num">${r.pct_circ != null ? r.pct_circ.toFixed(2) + "%" : "N/A"}</td>
      <td class="num">${fmtPct(r.pre7d_change_pct)}</td>
      <td class="num">${fmtPct(r.post_unlock_change_pct)}</td>
      <td class="num">${fmtPct(r.btc_post_change_pct)}</td>
      <td class="num">${fmtPp(r.relative_vs_btc_post_pp)}</td>
      <td>${srcLabel(r.sources)}</td>
      <td>${flagBadges(r.flags)}</td>
    </tr>`;
  }).join("");
}

function renderDaily(){
  const tb = $("tblDaily").querySelector("tbody");
  const daily = (snap.pre7d_daily || []).filter(d => d.series !== "BTC");
  tb.innerHTML = daily.map(d => `<tr>
    <td><b>${esc(d.ticker)}</b></td>
    <td>${esc(shortTime(d.unlock_time_utc8))}</td>
    ${[7,6,5,4,3,2,1].map(k => `<td class="num">${fmtPct(d["D-"+k+"_pct"])}</td>`).join("")}
    <td class="num">${fmtPct(d.total_7d_pct, 2)}</td>
  </tr>`).join("");
}

async function loadSnapshot(date){
  const path = "unlocks/" + date + ".json";
  const res = await loadJson(path);
  if (!res){ $("empty").style.display = "block"; return; }
  snap = res.data;
  $("empty").style.display = "none";
  $("poll").textContent = "数据：" + res.src + " · updated " + (snap.updated || "—");
  renderStats();
  renderObs();
  renderEvents();
  renderDaily();
}

async function init(){
  const idx = await loadJson("unlocks/index.json");
  if (!idx || !idx.data || !(idx.data.snapshots || []).length){
    $("empty").style.display = "block";
    $("poll").textContent = "index.json 加载失败";
    return;
  }
  indexData = idx.data;
  const sel = $("snapDate");
  sel.innerHTML = indexData.snapshots.map(s =>
    `<option value="${esc(s.date)}">${esc(s.date)} (${s.event_count || 0} 事件)</option>`
  ).join("");
  const params = new URLSearchParams(location.search);
  const q = params.get("date");
  const dates = indexData.snapshots.map(s => s.date);
  sel.value = (q && dates.includes(q)) ? q : dates[0];
  sel.onchange = () => {
    history.replaceState(null, "", "?date=" + sel.value);
    loadSnapshot(sel.value);
  };
  await loadSnapshot(sel.value);
}

document.querySelector("th[data-sort]").addEventListener("click", () => {
  sortRel = -sortRel;
  renderEvents();
});

init();
</script>
</body>
</html>
